#
# ASO redirect map.
#
# When the opt-in map directory "/etc/httpd/opt-in/aso.map.dir" is present,
# look up the requested host + URI in the "aso" rewrite map and, on a hit,
# issue a 301 redirect to the mapped target.
#
<IfFile "/etc/httpd/opt-in/aso.map.dir">
    RewriteEngine On
    RewriteOptions InheritDownBefore
    RewriteMap aso dbm=sdbm:/etc/httpd/opt-in/aso.map

    RewriteCond ${aso:%{HTTP_HOST}%{REQUEST_URI}} ^(.+)$
    RewriteRule ^ %1 [R=301,L,QSA]
</IfFile>
